name: PR Validation

on:
  pull_request:
    branches: [ "main", "master" ]

# Automatically cancel in-progress runs if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # This env variable forces Clippy and the compiler to treat warnings as errors globally
  RUSTFLAGS: "-D warnings"

jobs:
  validate-rust:
    name: Validate Rust Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (`cargo fmt`)
        run: cargo fmt --check

      - name: Run compiler check (`cargo check`)
        run: cargo check --all-targets --all-features

      - name: Run linter (`cargo clippy`)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests (`cargo test`)
        run: cargo test --all-targets --all-features
